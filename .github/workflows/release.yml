name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installers
        # Build first, then upload explicitly so a transient publish failure cannot
        # leave a release without latest.yml or its differential-update blockmap.
        run: npm run dist -- --publish never
      - name: Prepare and verify updater artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | ForEach-Object { Write-Host "Built: $($_.Name)" }
          $version = ("${{ github.ref_name }}").TrimStart('v')
          $setup = Get-ChildItem -Path dist -File -Filter "*.exe" |
            Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          $portable = Get-ChildItem -Path dist -File -Filter "*.exe" |
            Where-Object { $_.Name -notlike '*Setup*' } | Select-Object -First 1
          if (-not $setup -or -not $portable) {
            Write-Error "Setup or portable executable is missing from the Windows build."
            exit 1
          }

          # electron-builder 26 uses dotted safe artifact names while its update
          # metadata can reference hyphenated names. Normalize both sides so the
          # URL in latest.yml always names an asset that is actually uploaded.
          $originalBlockmap = "$($setup.FullName).blockmap"
          $canonicalSetup = Join-Path $setup.DirectoryName "C-Script-LocalHost-Panel-Setup-$version.exe"
          $canonicalPortable = Join-Path $portable.DirectoryName "C-Script-LocalHost-Panel-$version.exe"
          $canonicalBlockmap = "$canonicalSetup.blockmap"
          if ($setup.FullName -ne $canonicalSetup) {
            Move-Item -Path $setup.FullName -Destination $canonicalSetup -Force
          }
          if ($portable.FullName -ne $canonicalPortable) {
            Move-Item -Path $portable.FullName -Destination $canonicalPortable -Force
          }
          if ((Test-Path $originalBlockmap) -and $originalBlockmap -ne $canonicalBlockmap) {
            Move-Item -Path $originalBlockmap -Destination $canonicalBlockmap -Force
          }
          $setup = Get-Item $canonicalSetup

          # Always regenerate metadata from the final canonical Setup artifact.
          $latest = Join-Path $setup.DirectoryName 'latest.yml'
          $stream = [IO.File]::OpenRead($setup.FullName)
          try {
            $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($stream))
          } finally {
            $stream.Dispose()
          }
          $releaseDate = [DateTime]::UtcNow.ToString('o')
          $yaml = @(
            "version: $version",
            "files:",
            "  - url: $($setup.Name)",
            "    sha512: $sha512",
            "    size: $($setup.Length)"
          )
          if (Test-Path $canonicalBlockmap) {
            $blockmap = Get-Item $canonicalBlockmap
            $yaml += "    blockMapSize: $($blockmap.Length)"
          }
          $yaml += @(
            "path: $($setup.Name)",
            "sha512: $sha512",
            "releaseDate: '$releaseDate'"
          )
          $yaml | Set-Content -Path $latest -Encoding utf8
          Write-Host "Prepared canonical Setup asset and latest.yml: $($setup.Name)"
      - name: Upload and publish GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "C-Script LocalHost Panel $($tag.TrimStart('v'))" --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $assets = Get-ChildItem -Path dist -File | Where-Object {
            $_.Name -eq 'latest.yml' -or $_.Extension -eq '.exe' -or $_.Extension -eq '.blockmap'
          }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release edit $tag --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
