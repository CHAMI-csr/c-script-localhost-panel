name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installers
        # Build first, then upload explicitly so a transient publish failure cannot
        # leave a release without latest.yml or its differential-update blockmap.
        run: npm run dist -- --publish never
      - name: Prepare and verify updater artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -File | ForEach-Object { Write-Host "Built: $($_.Name)" }
          $version = ("${{ github.ref_name }}").TrimStart('v')
          $setup = Get-ChildItem -Path dist -File -Filter "*.exe" |
            Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          $portable = Get-ChildItem -Path dist -File -Filter "*.exe" |
            Where-Object { $_.Name -notlike '*Setup*' } | Select-Object -First 1
          if (-not $setup -or -not $portable) {
            Write-Error "Setup or portable executable is missing from the Windows build."
            exit 1
          }

          # electron-builder 26 can omit latest.yml when --publish=never. Generate
          # equivalent updater metadata so publishing remains a separate, retryable step.
          $latest = Join-Path $setup.DirectoryName 'latest.yml'
          if (-not (Test-Path $latest)) {
            $stream = [IO.File]::OpenRead($setup.FullName)
            try {
              $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($stream))
            } finally {
              $stream.Dispose()
            }
            $releaseDate = [DateTime]::UtcNow.ToString('o')
            $yaml = @(
              "version: $version",
              "files:",
              "  - url: $($setup.Name)",
              "    sha512: $sha512",
              "    size: $($setup.Length)",
              "path: $($setup.Name)",
              "sha512: $sha512",
              "releaseDate: '$releaseDate'"
            )
            $yaml | Set-Content -Path $latest -Encoding utf8
            Write-Host "Generated updater metadata: latest.yml"
          }
      - name: Upload and publish GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "C-Script LocalHost Panel $($tag.TrimStart('v'))" --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $assets = Get-ChildItem -Path dist -File | Where-Object {
            $_.Name -eq 'latest.yml' -or $_.Extension -eq '.exe' -or $_.Extension -eq '.blockmap'
          }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release edit $tag --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
